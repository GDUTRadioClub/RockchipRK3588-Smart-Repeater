# ELF2 中继控制中心 · journald 容量上限
#
# 问题：板端 /etc/systemd/journald.conf 里只有一行 [Journal]，没有任何上限，
# journald 因此可以吃掉文件系统的 10%（实测已占 984 MB，/var/log 共 1.1 GB）。
# 板子根分区 28G、可用内存长期只有 100~200 MB，这些页缓存和写入压力
# 会直接放大 SQLite 与 GIL 争抢下的接口延迟。
#
# 部署：
#   sudo install -m 0644 99-elf2-journald.conf /etc/systemd/journald.conf.d/
#   sudo mkdir -p /etc/systemd/journald.conf.d        # 若目录不存在
#   sudo systemctl restart systemd-journald
#   # 立即回收已有日志到 100M 以内：
#   sudo journalctl --vacuum-size=100M
#
# 效果核对：
#   journalctl --disk-usage      # 应回落到 100M 附近并保持

[Journal]
# 持久日志总上限
SystemMaxUse=100M
# 单个日志文件上限
SystemMaxFileSize=16M
# 保留的最久历史
MaxRetentionSec=2week
# 运行时（内存）日志上限
RuntimeMaxUse=32M
# 压缩已归档日志
Compress=yes
